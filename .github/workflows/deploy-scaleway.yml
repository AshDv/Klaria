name: Deploy Klaria to Scaleway

on:
  push:
    branches:
      - brand/final-nolya-release
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Scaleway registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCALEWAY_SECRET_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            rg.fr-par.scw.cloud/scribe-poc-private/scribe:klaria-final
            rg.fr-par.scw.cloud/scribe-poc-private/scribe:klaria-final-${{ github.sha }}

      - name: Deploy container
        uses: httptoolkit/deploy-scaleway-serverless-container-action@v1
        with:
          container_id: a4f75776-f15e-42d9-ad2a-1dcfc88fc9a5
          secret_key: ${{ secrets.SCALEWAY_SECRET_KEY }}
          registry_image_url: rg.fr-par.scw.cloud/scribe-poc-private/scribe:klaria-final
          region: fr-par
          timeout_seconds: 180
